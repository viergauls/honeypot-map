# 蜜獾地图 — 家庭路由器上的公网蜜罐攻击地图
#
# 用法（在路由器上）:
#   docker compose -f docker-compose.yml up -d
#
# 说明:
#   - 镜像直接复用路由器上已有的 ylbw-node:22-alpine（免 docker build，免拉取）
#   - 代码通过 volume 挂载进容器，更新代码只需 rsync + docker restart
#   - 诱饵端口映射到宿主机 0.0.0.0，配合 WAN input=ACCEPT 直接暴露公网

services:
  honeypot-map:
    image: ylbw-node:22-alpine
    container_name: honeypot-map
    restart: unless-stopped
    working_dir: /app
    volumes:
      - /opt/apps/honeypot-map:/app
      - /opt/apps/honeypot-map/data:/app/data
    environment:
      WEB_PORT: "18080"
      TRAP_PORTS: "2222,2375,3389,5900,6379,9200,1337"
      HTTP_TRAP_PORT: "1337"
      DATA_DIR: /app/data
      HOME_NAME: "我的位置"
    ports:
      - "18080:18080"   # Web 地图
      - "2222:2222"     # SSH 备用
      - "2375:2375"     # Docker API
      - "3389:3389"     # RDP
      - "5900:5900"     # VNC
      - "6379:6379"     # Redis
      - "9200:9200"     # Elasticsearch
      - "1337:1337"     # 假 HTTP（抓 UA/路径）
